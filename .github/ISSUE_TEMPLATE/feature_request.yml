name: Feature request
description: Propose a prototype improvement
title: '[Feature] '
body:
  - type: textarea
    id: problem
    attributes:
      label: Learner need or development problem
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior and acceptance criteria
      description: Link the relevant conversation or specification where possible.
    validations:
      required: true
