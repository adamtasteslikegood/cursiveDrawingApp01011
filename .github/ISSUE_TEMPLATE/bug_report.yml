name: Bug report
description: Report a prototype or tooling problem
title: '[Bug] '
body:
  - type: textarea
    id: behavior
    attributes:
      label: Reproduction and expected behavior
      description: Include steps, actual behavior, and what you expected.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Commit, device, OS, Playgrounds or Xcode version, and input tool.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Logs or screenshots
      description: Remove personal handwriting and sensitive data before attaching.
