name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  repository:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 scripts/check_repository.py
  ios:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolchain
        run: xcodebuild -version && swift --version
      - name: Lint
        run: ./scripts/lint.sh
      - name: Build iOS app
        run: ./scripts/build.sh
      - name: Analyzer regression tests
        run: ./scripts/test.sh
      - name: Package playground
        run: zip -r CursivePrototype.zip CursivePrototype.swiftpm -x '*/.swiftpm/*' '*/.build/*'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: CursivePrototype-${{ github.sha }}
          path: CursivePrototype.zip
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: iOS-test-results
          path: .build/*.xcresult
          include-hidden-files: true
          if-no-files-found: ignore
